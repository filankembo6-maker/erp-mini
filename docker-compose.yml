services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - erp_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: erp_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - erp_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: erp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: erp_mini_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: erp_user
    ports:
      - "3307:3306"
    volumes:
      - erp_db_data:/var/lib/mysql
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  erp_db_data: